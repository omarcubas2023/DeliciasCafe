<div class="registro-page">
  <div class="registro-card">

    <div class="registro-logo">
      <h2>Delicias &amp; Café</h2>
      <p>Crea tu cuenta nueva</p>
    </div>

    <div class="exito-msg" *ngIf="exito">{{ exito }}</div>
    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <!-- Selector de rol -->
    <div class="form-group">
      <label>Tipo de cuenta</label>
      <div class="roles-grid">
        <div class="rol-card"
          *ngFor="let r of roles"
          [class.seleccionado]="rol === r.valor"
          (click)="rol = r.valor">
          <span class="rol-label">{{ r.label }}</span>
          <span class="rol-desc">{{ r.desc }}</span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Nombre Completo</label>
      <input type="text" [(ngModel)]="nombre"
        placeholder="Tu nombre completo" class="input"/>
    </div>

    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" [(ngModel)]="email"
        placeholder="tu@email.com" class="input"/>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password"
        placeholder="Mínimo 6 caracteres" class="input"/>
    </div>

    <div class="form-group">
      <label>Confirmar Contraseña</label>
      <input type="password" [(ngModel)]="confirmarPassword"
        placeholder="Repite tu contraseña" class="input"/>
    </div>

    <button class="btn-registro" (click)="registrarse()" [disabled]="cargando">
      {{ cargando ? 'Creando cuenta...' : 'Crear Cuenta' }}
    </button>

    <p class="login-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión</a>
    </p>

  </div>
</div>
