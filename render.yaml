services:
  - type: web
    name: delicias-cafe
    runtime: docker
    plan: free
    healthCheckPath: /api/productos
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: YAPE_PHONE
        sync: false
