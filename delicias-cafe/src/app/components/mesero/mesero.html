<div class="panel-page">
  <div class="panel-header">
    <div>
      <h1>Panel de Mesero</h1>
      <p>Gestiona los pedidos de las mesas</p>
    </div>
  </div>

  <div class="mensaje exito" *ngIf="mensaje && mensajeTipo === 'exito'">{{ mensaje }}</div>
  <div class="mensaje error" *ngIf="mensaje && mensajeTipo === 'error'">{{ mensaje }}</div>

  <div class="pedidos-grid">
    <div class="pedido-vacio" *ngIf="pedidos.length === 0">
      <span>🛎️</span>
      <p>No hay pedidos asignados aún.</p>
    </div>

    <div class="pedido-card" *ngFor="let pedido of pedidos">
      <div class="pedido-card-header">
        <h3>Pedido #{{ pedido.id }}</h3>
        <span class="badge"
          [class.pagado]="pedido.estado === 'pagado'"
          [class.en-cocina]="pedido.estado === 'en_cocina'"
          [class.listo]="pedido.estado === 'listo'"
          [class.entregado]="pedido.estado === 'entregado'">
          {{ pedido.estado }}
        </span>
      </div>
      <p class="pedido-total">Total: <strong>S/ {{ pedido.total }}</strong></p>
      <p class="pedido-metodo">Pago: {{ pedido.metodoPago }}</p>

      <div class="pedido-acciones">
        <button class="btn-cocina"
          *ngIf="pedido.estado === 'pagado'"
          (click)="mandarACocina(pedido)">
          Mandar a Cocina
        </button>
        <button class="btn-entregar"
          *ngIf="pedido.estado === 'listo'"
          (click)="marcarEntregado(pedido)">
          Marcar Entregado
        </button>
        <span class="en-proceso" *ngIf="pedido.estado === 'en_cocina'">
          En cocina...
        </span>
        <span class="entregado-msg" *ngIf="pedido.estado === 'entregado'">
          Entregado
        </span>
      </div>
    </div>
  </div>
</div>
